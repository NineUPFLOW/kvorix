backend = "glx";
legacy-backends = true;
vsync = true;
shadow = true;
shadow-radius = 16;
shadow-offset-x = -9;
shadow-offset-y = -7;
shadow-opacity = 0.30;
shadow-exclude = [
  "class_g ~= 'rsaarm-bar'",
  "_GTK_FRAME_EXTENTS@",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
fading = true;
fade-in-step = 0.12;
fade-out-step = 0.15;
fade-delta = 8;
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Xorg'"
];

unredir-if-possible = true;
