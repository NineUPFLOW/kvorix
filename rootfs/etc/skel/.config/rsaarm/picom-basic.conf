# Armbian — композитор: скругления окон, мягкие тени, короткие анимации (xrender, без нагрузки на GPU)
backend = "xrender";
vsync = true;
corner-radius = 0;  # скругление окон на xrender (Mali без GL у picom) стоит +70% CPU при перемещении
rounded-corners-rule = [ "14:name = 'rsaarm-menu'" ];
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "name = 'rsaarm-taskbar'"
];
shadow = true;
shadow-radius = 18;
shadow-offset-x = -12;
shadow-offset-y = -8;
shadow-opacity = 0.22;
shadow-exclude = [
  "name = 'rsaarm-taskbar'",
  "_GTK_FRAME_EXTENTS@",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'"
];
fading = true;
fade-in-step = 0.14;
fade-out-step = 0.18;
fade-delta = 6;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

# полноэкранное видео/игры — мимо композитора: без мерцания курсора и лишней нагрузки
unredir-if-possible = true;
